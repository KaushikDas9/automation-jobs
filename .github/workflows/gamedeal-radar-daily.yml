name: GameDeal Radar daily price check

# Schedule assumption (UNVERIFIED): Steam refreshes its deals around 10:00 AM
# Pacific Time. That is 18:00 UTC in winter (PST, UTC-8) and 17:00 UTC in summer
# (PDT, UTC-7). GitHub cron is UTC only and does not observe DST, so the two runs
# below are fixed in UTC:
#   "30 18 * * *"  18:30 UTC = 00:00 IST. About 30 min after the refresh in winter,
#                  about 90 min after in summer.
#   "30 6 * * *"   06:30 UTC = 12:00 IST. Twelve hours after the first run.
# IST is UTC+5:30 with no DST. To convert IST to UTC, subtract 5h30m.
# GitHub can start scheduled runs 5 to 30 minutes late under load, so do not rely
# on an exact start time.

on:
  schedule:
    - cron: "30 18 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch prices but write nothing to the database"
        type: boolean
        default: true
      limit:
        description: "Max games to process (leave empty for all)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: gamedeal-radar-daily
  cancel-in-progress: false

jobs:
  price-check:
    name: Steam India price check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/gamedeal-radar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: projects/gamedeal-radar/go.sum

      - name: Build and test
        run: |
          go vet ./...
          go test ./...

      - name: Run daily check
        env:
          GDR_DATABASE_URL: ${{ secrets.GDR_DATABASE_URL }}
          # Inputs exist only on workflow_dispatch. On schedule events
          # github.event_name is "schedule", so the first clause is false and
          # the expression yields '0' (a real write run, since only "1" or
          # "true" enables dry run). A manual run uses inputs.dry_run, which
          # defaults to true, and yields '1' unless the boolean is unticked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
          # On schedule the expression yields '' (no limit). On manual runs it
          # passes the typed value, which is '' when left empty.
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
        run: go run ./cmd/daily-check
