name: GameDeal Radar weekly Steam tags

# Stores each game's top Steam user tags (up to 10, most popular first) in game_details.tags.
# Weekly, on Sunday. The job writes only that column. GitHub cron is UTC only.
# 05:00 UTC is 10:30 IST on Sunday. IST has no DST, so the time never shifts.

on:
  schedule:
    - cron: "0 5 * * 0"   # Sunday 05:00 UTC, 10:30 IST
  workflow_dispatch:
    # Manual runs default to dry run. Untick dry_run to write the tags.
    inputs:
      dry_run:
        description: "Fetch the tags but write nothing to the database"
        type: boolean
        default: true
      limit:
        description: "Max games to fetch (leave empty for all)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  # Only used by the final-failure step to open a job-failure issue.
  issues: write

# One run at a time, and one pending. A new run never cancels a running one.
concurrency:
  group: gamedeal-radar-steam-tags
  cancel-in-progress: false

jobs:
  steam-tags:
    name: Steam user tags
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/gamedeal-radar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: projects/gamedeal-radar/go.sum

      - name: Build and test
        run: |
          go vet ./...
          go test ./...

      - name: Store Steam tags
        id: tags
        env:
          GDR_DATABASE_URL: ${{ secrets.GDR_DATABASE_URL }}
          # Shared by every project in the repo (one channel). GDR_SLACK_WEBHOOK_URL is
          # the optional fallback, read only when SLACK_WEBHOOK_URL is empty.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GDR_SLACK_WEBHOOK_URL: ${{ secrets.GDR_SLACK_WEBHOOK_URL }}
          # Inputs exist only on workflow_dispatch. On schedule DRY_RUN is '0' (real write)
          # and LIMIT is '' (no limit).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
          # The scheduled run is the only run of the week, so it is the final attempt.
          FINAL_ATTEMPT: ${{ github.event_name == 'schedule' && '1' || '0' }}
        # The program writes complete, final_attempt and blocked to GITHUB_OUTPUT, even when it exits 1.
        run: go run ./cmd/steam-tags

      - name: Open issue on failure
        # Runs only when this job failed on the scheduled run.
        if: failure() && steps.tags.outputs.final_attempt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="GameDeal Radar: Steam tags update failed"
          gh label create job-failure --force --color B60205 \
            --description "GameDeal Radar job failures" >/dev/null 2>&1 || true
          if gh issue list --state open --label job-failure --limit 200 --json title --jq '.[].title' \
            | grep -Fxq "$TITLE"; then
            echo "An open issue with this title already exists. Not creating a duplicate."
            exit 0
          fi
          BODY=$(mktemp)
          {
            echo "The scheduled Steam tags update failed. The tags were not all stored this week."
            echo
            echo "- Run: ${RUN_URL}"
            echo
            echo "No secrets are included here. Check the run log for the reason."
          } > "$BODY"
          gh issue create --title "$TITLE" --label job-failure --body-file "$BODY" \
            || echo "Could not create the failure issue. The run log has the details."

      - name: Close failure issue after recovery
        # Best effort. Closes only the issue with this job's title.
        if: success() && steps.tags.outputs.complete == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="GameDeal Radar: Steam tags update failed"
          for n in $(gh issue list --state open --label job-failure --limit 200 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number"); do
            gh issue close "$n" --comment "Recovered. The Steam tags were stored successfully." || true
          done
