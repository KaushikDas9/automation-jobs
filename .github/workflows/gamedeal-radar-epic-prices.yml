name: GameDeal Radar Epic price check

# Reads the Epic Games Store price of every active game through the price data provider and
# stores it in game_store_prices (store 'epic'). Epic itself is never called, and the provider's deal
# URLs are never read or stored. Requires the ITAD_API_KEY secret. The provider asks for credit
# for its data; see the README of projects/gamedeal-radar.
# Two runs a day: the main run and a backup (already-complete check as for GOG).
# GitHub cron is UTC only. IST has no DST, so these times never shift.
#   04:00 UTC = 09:30 IST (main), 08:00 UTC = 13:30 IST (backup, last scheduled run)
on:
  schedule:
    - cron: "0 4 * * *"   # main, 04:00 UTC
    - cron: "0 8 * * *"   # backup, 08:00 UTC (final scheduled run)
  workflow_dispatch:
    # Manual runs default to dry run. Untick dry_run to write data. Manual runs skip the
    # already-complete check and are never the final scheduled attempt.
    inputs:
      dry_run:
        description: "Fetch prices but write nothing to the database"
        type: boolean
        default: true
      limit:
        description: "Max games to fetch (leave empty for all)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  # Only used by the final-failure and recovery steps to manage the job-failure issue.
  issues: write

# One run at a time, and one pending. A new run never cancels a running one.
concurrency:
  group: gamedeal-radar-epic-prices
  cancel-in-progress: false

jobs:
  prices:
    name: Epic prices
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/gamedeal-radar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: projects/gamedeal-radar/go.sum

      - name: Build and test
        run: |
          go vet ./...
          go test ./...

      - name: Run Epic price check
        id: run
        env:
          GDR_DATABASE_URL: ${{ secrets.GDR_DATABASE_URL }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          # Shared by every project in the repo (one channel). GDR_SLACK_WEBHOOK_URL is
          # the optional fallback, read only when SLACK_WEBHOOK_URL is empty.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GDR_SLACK_WEBHOOK_URL: ${{ secrets.GDR_SLACK_WEBHOOK_URL }}
          # Inputs exist only on workflow_dispatch. On schedule DRY_RUN is '0' (real write)
          # and LIMIT is '' (no limit).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
          # 1 only on the last scheduled run of the day, so a failure there opens an issue.
          FINAL_ATTEMPT: ${{ github.event.schedule == '0 8 * * *' && '1' || '0' }}
        # The program writes complete, final_attempt, blocked, coverage_pct, failed_games and
        # total_games to GITHUB_OUTPUT, even when it exits 1.
        run: go run ./cmd/epic-prices

      - name: Open issue on final failure
        # Runs only when this job failed on the last scheduled run of the day.
        if: failure() && steps.run.outputs.final_attempt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE: ${{ steps.run.outputs.coverage_pct }}
          FAILED: ${{ steps.run.outputs.failed_games }}
          TOTAL: ${{ steps.run.outputs.total_games }}
          BLOCKED: ${{ steps.run.outputs.blocked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="GameDeal Radar: Epic price check failed"
          gh label create job-failure --force --color B60205 \
            --description "GameDeal Radar job failures" >/dev/null 2>&1 || true
          if gh issue list --state open --label job-failure --limit 200 --json title --jq '.[].title' \
            | grep -Fxq "$TITLE"; then
            echo "An open issue with this title already exists. Not creating a duplicate."
            exit 0
          fi
          BODY=$(mktemp)
          {
            echo "The last scheduled run of Epic price check ended below the success threshold, or was blocked by the store."
            echo
            echo "- Coverage: ${COVERAGE}% of active games handled in this run"
            echo "- Games failed: ${FAILED} of ${TOTAL}"
            echo "- Blocked by the store: ${BLOCKED}"
            echo "- Run: ${RUN_URL}"
            echo
            echo "No secrets are included here. Check the run log for per-game errors."
          } > "$BODY"
          gh issue create --title "$TITLE" --label job-failure --body-file "$BODY" \
            || echo "Could not create the failure issue. The run log has the details."

      - name: Close failure issue after recovery
        # Best effort. Closes only the issue with this job's title.
        if: success() && steps.run.outputs.complete == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="GameDeal Radar: Epic price check failed"
          for n in $(gh issue list --state open --label job-failure --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number"); do
            gh issue close "$n" --comment "Recovered. The Epic price check job completed successfully." || true
          done
